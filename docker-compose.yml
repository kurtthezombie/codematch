services:
  db:
    container_name: codematch-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: codematch
      POSTGRES_USER: codematch
      POSTGRES_PASSWORD: codematch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codematch -d codematch"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: codematch-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://codematch:codematch@db:5432/codematch?schema=public
      AUTH_JWT_SECRET: dev-secret
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"

  frontend:
    container_name: codematch-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
